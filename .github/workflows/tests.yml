name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Distros ship paho-mqtt 1.x, PyPI installs 2.x. The client code has
        # to work on both, and only running both keeps that honest.
        python-version: ['3.9', '3.12']
        paho: ['paho-mqtt==1.6.1', 'paho-mqtt>=2,<3']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "${{ matrix.paho }}"

      - name: Show versions
        run: pip show paho-mqtt | head -2

      # No broker, no sensor and no libhidapi needed - the suite stubs all three
      - name: Run tests
        run: python -m pytest -q
